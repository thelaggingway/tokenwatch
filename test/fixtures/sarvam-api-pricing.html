<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the pricing for Text to Speech (Bulbul v3)?","acceptedAnswer":{"@type":"Answer","text":"Text to Speech is priced at ₹3.00 per 1,000 characters for both real-time and streaming usage."}},{"@type":"Question","name":"What should I pay when I get started?","acceptedAnswer":{"@type":"Answer","text":"You'll receive ₹100 worth of free credits on signup. Once these credits are used, you can add more credits whenever you need them."}},{"@type":"Question","name":"How many credits do I receive?","acceptedAnswer":{"@type":"Answer","text":"When you make a payment, you receive the same number of credits as the amount paid. For example, ₹1,000 gives you 1,000 credits, available immediately in your account."}},{"@type":"Question","name":"Do I need to pay again next month?","acceptedAnswer":{"@type":"Answer","text":"Pay as you go has no monthly fee: you only pay when you buy more credits. Pro, Growth, and Business have a minimum monthly subscription that comes back in full as credits. You renew that subscription to keep the plan rate and limits, and you can add more credits any time."}},{"@type":"Question","name":"What happens if I don't use all my credits? Do they expire?","acceptedAnswer":{"@type":"Answer","text":"No, credits do not expire. Any unused credits are rolled over automatically and remain available until you use them."}},{"@type":"Question","name":"Once I use up all my credits, what happens?","acceptedAnswer":{"@type":"Answer","text":"Once your credits are exhausted, API calls will return errors. You'll be notified and can add more credits at any time. Top-ups do not change your plan benefits, including rate limits."}},{"@type":"Question","name":"Can I increase my rate limit?","acceptedAnswer":{"@type":"Answer","text":"Yes, this is possible under a custom arrangement. We can discuss and configure higher limits based on your specific use case."}},{"@type":"Question","name":"Do my credits cover all APIs and features?","acceptedAnswer":{"@type":"Answer","text":"Yes, credits are universal and can be used across all supported APIs and services."}},{"@type":"Question","name":"How do I purchase more credits?","acceptedAnswer":{"@type":"Answer","text":"You can top up from the dashboard whenever you need. Your existing account limits remain the same."}},{"@type":"Question","name":"Can I get an invoice for my payment?","acceptedAnswer":{"@type":"Answer","text":"Yes. An official invoice will be automatically generated and shared after every payment."}},{"@type":"Question","name":"Do you support refunds or cancellations?","acceptedAnswer":{"@type":"Answer","text":"No, since credits do not expire and roll over indefinitely for now, all payments are final and non-refundable."}},{"@type":"Question","name":"How are credits calculated for usage?","acceptedAnswer":{"@type":"Answer","text":"Credits are deducted according to the API used. Text to Speech is billed by characters, Speech to Text by audio duration, LLMs by tokens, Document AI by pages, and Dubbing by the minute."}},{"@type":"Question","name":"Can multiple team members share the same credits?","acceptedAnswer":{"@type":"Answer","text":"Currently, credits are tied to a single account. We are working on introducing organization-level accounts, which will allow multiple team members to manage usage and credits seamlessly under one shared account."}},{"@type":"Question","name":"Is there a minimum or maximum purchase amount for credits?","acceptedAnswer":{"@type":"Answer","text":"There is a minimum purchase amount. For larger or custom requirements, our team can configure higher packages."}},{"@type":"Question","name":"What happens if I need features or limits outside the standard plan?","acceptedAnswer":{"@type":"Answer","text":"We offer custom plans for advanced use cases, such as higher rate limits, enterprise billing, or additional support. These can be tailored to your needs."}}]}</script>
