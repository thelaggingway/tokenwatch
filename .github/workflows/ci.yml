name: CI

on:
  pull_request:
    branches:
      - main
      # Stacked PR series are based on the previous segment rather than main,
      # so without this pattern only the bottom PR would ever be verified.
      - 'api/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        env:
          TW_PARITY_LIVE: '0'
        run: node --test test/*.test.mjs

      # A root Wrangler config copied for local D1 work is auto-discovered by
      # the Pages publisher and would bind the placeholder PRICE_HISTORY
      # database to production. Fail here, before the build, with guidance.
      - name: Guard against an auto-discovered local Wrangler config
        run: node scripts/check-no-local-wrangler.mjs

      # Exercise the deploy build before merge using the committed catalogs.
      # No provider API keys or Cloudflare deployment credentials are needed.
      - name: Generate SEO
        run: node scripts/generate-seo.mjs

      - name: Verify generated SEO surface
        run: node scripts/verify-seo.mjs

      - name: Bust cache (content-hashed asset paths)
        run: node scripts/bust-cache.mjs

      - name: Minify JSON
        run: node scripts/minify-json.mjs

      - name: Compile Pages Functions (no deployment)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@3.90.0 pages functions build functions --outdir "$RUNNER_TEMP/tokenwatch-functions"
